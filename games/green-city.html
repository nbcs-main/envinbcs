<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script><title>Green City</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f1e8;--fg:#1d2b1f;--b:#2d6a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--fg:#e6efe6;--b:#40916c}}
:root[data-theme="dark"]{--bg:#14201a;--fg:#e6efe6;--b:#40916c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{padding:6px;font-weight:600;text-align:center}
#w{position:relative}
canvas{width:min(100vw,calc(100dvh - 210px));aspect-ratio:1;display:block;image-rendering:pixelated;border:2px solid var(--b)}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000a;color:#fff;font-size:20px;text-align:center}
#ctl{display:flex;justify-content:space-between;align-items:center;width:min(100vw,420px);padding:10px 16px;box-sizing:border-box}
#dp{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
b{display:flex;align-items:center;justify-content:center;background:var(--b);color:#fff;border-radius:12px;font-size:22px}
#fire{width:96px;height:96px;border-radius:50%;font-size:16px}
#w{position:relative}#mp{display:none;position:absolute;top:26px;left:50%;transform:translateX(-50%);width:min(92vw,380px);max-height:70vh;overflow:auto;background:var(--bg);border:2px solid var(--b);border-radius:10px;padding:10px;z-index:4;touch-action:auto;font-size:13px;box-sizing:border-box}
textarea{width:100%;height:56px;box-sizing:border-box;user-select:text;-webkit-user-select:text;font:11px monospace}
b.s{display:inline-flex;padding:6px 12px;font-size:13px;margin:4px 2px}
.o{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);z-index:5;touch-action:auto;overflow:auto;text-align:center;padding:10px;box-sizing:border-box}
.o input{font-size:18px;padding:8px;border-radius:8px;border:1px solid var(--b);background:transparent;color:var(--fg);user-select:text;-webkit-user-select:text}
b.s{display:inline-flex;padding:8px 14px;font-size:15px;margin:2px}b.s:has(+x){}
b[disabled]{opacity:.4}
</style></head><body>
<div id="hud">Green City</div>
<div id="w"><canvas id="c"></canvas><div id="hm" class="o"><h2 style="margin:0">🌳 Green City</h2><input id="pn" maxlength="12" placeholder="Ranger name"><b id="cr" class="s">Create room</b><div><input id="ci" maxlength="4" placeholder="CODE" style="width:90px;text-transform:uppercase"> <b id="bj" class="s">Join</b></div><b id="so" class="s">Play solo</b><div id="st" style="min-height:1.2em;text-align:center"></div></div>
<div id="lb" class="o" style="display:none"><div>Room code</div><div id="rc" style="font-size:34px;font-weight:700;letter-spacing:6px"></div><div id="pl"></div><div id="lm"></div><div><b id="cp" class="s">Copy invite link</b> <b id="sg" class="s">Start game</b></div></div>
<div id="ov"><div>City cleared! 🌳</div><b id="nm" style="padding:10px 18px;margin-top:12px;font-size:16px">New map</b></div></div>
<div id="ctl"><div id="dp"><b data-d="0" style="grid-area:1/2">▲</b><b data-d="3" style="grid-area:2/1">◀</b><b data-d="1" style="grid-area:2/3">▶</b><b data-d="2" style="grid-area:3/2">▼</b></div><b id="fire">FIRE</b></div>
<script>
const N=21,T=16,DX=[0,1,0,-1],DY=[-1,0,1,0],cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=cv.height=N*T;
const COL=['#e76f51','#2a9d8f','#e9c46a','#9b5de5','#f15bb5','#4361ee'],myCol=COL[Math.random()*6|0];
let peers=[],pm={},isHost=false,chans=[],slots=[],myId='b'+Math.random().toString(36).slice(2,8),seed=Math.random()*1e9|0,tsd=0,map=[],cleaned=new Set(),mine=[],total=1,score=0,hits=0,kills=0,fdt=.016,won=false;
let phase='home',cdEnd=0,myName='Ranger',room='',me={x:10.5,y:19.5,d:0,cd:0},bots=[],bul=[],dirs=[],firing=false,pt=0;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(s){const r=rng(s),m=[];total=0;
 for(let y=0;y<N;y++){m[y]=[];for(let x=0;x<=10;x++){const v=r();let t=v<.34?1:v<.42?3:v<.52?2:0;
  if(y<2||(y>=N-2&&x>=6))t=0;m[y][x]=t;m[y][N-1-x]=t}}
 m.forEach(row=>row.forEach(t=>{if(t==1)total++}));return m}
function reset(){map=gen(seed);mine=[];cleaned=new Set();bul=[];won=false;score=0;kills=0;hits=0;
 document.getElementById('ov').style.display='none';spawn();
 bots=[[1.5,.5],[10.5,.5],[19.5,.5]].map(p=>({x:p[0],y:p[1],sx:p[0],sy:p[1],d:2,t:0,f:1,dead:0}))}
function spawn(){me.x=8.5+(Math.random()*5|0);me.y=19.5;me.d=0}
function solid(tx,ty){if(tx<0||ty<0||tx>=N||ty>=N)return 1;const t=map[ty][tx];return t==3||(t==1&&!cleaned.has(ty*N+tx))}
function hit(x,y){for(const[a,b]of[[-.4,-.4],[.4,-.4],[-.4,.4],[.4,.4]])if(solid(Math.floor(x+a),Math.floor(y+b)))return 1;return 0}
function clean(i){if(mine.length<400)mine.push(i);cleaned.add(i);score++}
function sync(){cleaned=new Set(mine);for(const p of peers){const q=p.presence;if(q&&q.sd===seed&&q.c)q.c.forEach(i=>cleaned.add(i))}}
const age=id=>Math.min(.25,(Date.now()-(pm[id]?pm[id].t:0))/1000),RS={};
function smooth(k,tx,ty){const r=RS[k]||(RS[k]={x:tx,y:ty});if(Math.hypot(tx-r.x,ty-r.y)>3){r.x=tx;r.y=ty}else{const f=1-Math.exp(-fdt*18);r.x+=(tx-r.x)*f;r.y+=(ty-r.y)*f}return r}
const isClient=()=>!isHost&&chans.length>0,hp=()=>{const p=peers.find(q=>q.peer=='a');return p?p.presence:{}},
hbots=sm=>{const a=age('a');return(hp().bt||[]).map((e,i)=>{let x=e[0]+(e[4]?DX[e[2]]*2.2*a:0),y=e[1]+(e[4]?DY[e[2]]*2.2*a:0);if(sm){const r=smooth('b'+i,x,y);x=r.x;y=r.y}return{x,y,d:e[2],dead:e[3],i}})},
hbb=()=>{const a=age('a');return(hp().bb||[]).map(b=>[b[0]+DX[b[2]]*9*a,b[1]+DY[b[2]]*9*a])};
function prog(){let k=kills,h=hits;for(const p of peers){const q=p.presence;if(q&&q.sd===seed){k+=q.kl||0;h+=q.ht||0}}return Math.max(0,Math.min(total,cleaned.size+2*k-3*h))}
let pubN=0,lastC=0;
function pub(){const n=Date.now();for(const k in pm)if(n-pm[k].t>3000)delete pm[k];
 peers=Object.keys(pm).map(id=>({peer:id,isMe:false,presence:pm[id].p}));sync();
 if(!chans.length)return;const r=v=>Math.round(v*10)/10,full=(++pubN%20==1)||mine.length!=lastC;lastC=mine.length;
 const m={id:myId,q:pubN,sd:seed,x:r(me.x),y:r(me.y),d:me.d,mv:dirs.length?1:0,nm:myName,col:myCol,k:score,kl:kills,ht:hits,b:bul.filter(b=>b.o).slice(0,5).map(b=>[r(b.x),r(b.y),b.d])};
 if(full)m.c=mine;
 if(isHost){m.bt=bots.map(b=>[r(b.x),r(b.y),b.d,b.dead>0?1:0,b.mv?1:0]);m.bb=bul.filter(b=>!b.o).slice(0,12).map(b=>[r(b.x),r(b.y),b.d])}
 send(JSON.stringify(m))}
function send(m,not){chans.forEach(c=>{if(c!==not&&c.open)try{c.send(m)}catch(e){}})}
function step(dt){if(phase=='count'&&performance.now()>=cdEnd)phase='play';if(won||phase!='play')return;
 const d=dirs[dirs.length-1];
 if(d!=null){me.d=d;const nx=me.x+DX[d]*4*dt,ny=me.y+DY[d]*4*dt;if(!hit(nx,ny)){me.x=nx;me.y=ny}}
 me.cd-=dt;if(firing&&me.cd<=0){me.cd=.35;bul.push({x:me.x+DX[me.d]*.5,y:me.y+DY[me.d]*.5,d:me.d,o:1})}
 for(const b of isClient()?[]:bots){
  if(b.dead>0){b.dead-=dt;if(b.dead<=0){b.x=b.sx;b.y=b.sy}continue}
  b.t-=dt;if(b.t<=0){b.d=Math.random()<.5?2:Math.random()*4|0;b.t=.5+Math.random()*1.2}
  const nx=b.x+DX[b.d]*2.2*dt,ny=b.y+DY[b.d]*2.2*dt;if(hit(nx,ny)){b.t=0;b.mv=0}else{b.x=nx;b.y=ny;b.mv=1}
  b.f-=dt;if(b.f<=0){b.f=1+Math.random()*1.5;bul.push({x:b.x+DX[b.d]*.5,y:b.y+DY[b.d]*.5,d:b.d,o:0})}}
 bul=bul.filter(b=>{b.x+=DX[b.d]*9*dt;b.y+=DY[b.d]*9*dt;const tx=Math.floor(b.x),ty=Math.floor(b.y);
  if(solid(tx,ty)){const i=ty*N+tx;if(b.o&&tx>=0&&ty>=0&&tx<N&&ty<N&&map[ty][tx]==1&&!cleaned.has(i))clean(i);return false}
  if(b.o){for(const o of isClient()?hbots():bots)if(!(o.dead>0)&&Math.hypot(o.x-b.x,o.y-b.y)<.6){if(isClient())send(JSON.stringify({t:'kill',i:o.i}));else o.dead=4;score+=3;kills++;return false}}
  else if(Math.hypot(me.x-b.x,me.y-b.y)<.5){hits++;spawn();return false}
  return true});
 if(isClient())for(const b of hbb())if(Math.hypot(me.x-b[0],me.y-b[1])<.6){hits++;spawn();break}
 if(prog()/total>=.85){won=true;phase='over';$('nm').style.display=(isHost||!chans.length)?'':'none';document.getElementById('ov').style.display='flex'}}
function tank(x,y,d,c){g.save();g.translate(x*T,y*T);g.rotate(d*Math.PI/2);g.fillStyle=c;g.fillRect(-6,-6,12,12);g.fillStyle='#222';g.fillRect(-7,-7,3,14);g.fillRect(4,-7,3,14);g.fillRect(-1.5,-10,3,8);g.restore()}
function lbl(t,x,y){g.fillStyle='#222';g.font='8px sans-serif';g.textAlign='center';g.fillText(t||'',x*T,y*T-10)}
function draw(){g.fillStyle='#cfe3c1';g.fillRect(0,0,N*T,N*T);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=map[y][x],px=x*T,py=y*T;
  if(t==1){if(cleaned.has(y*N+x)){g.fillStyle='#2f9e44';g.beginPath();g.arc(px+8,py+8,6,0,7);g.fill();g.fillStyle='#6fcf7f';g.fillRect(px+6,py+5,3,3)}
   else{g.fillStyle='#5c5c63';g.fillRect(px,py,T,T);g.fillStyle='#8a8a92';g.fillRect(px+2,py+2,5,5);g.fillRect(px+9,py+8,5,5)}}
  else if(t==3){g.fillStyle='#4b6584';g.fillRect(px,py,T,T);g.fillStyle='#778ca3';g.fillRect(px,py+7,T,2)}}
 for(const p of peers){const q=p.presence;if(!q||q.x==null)continue;const a=age(p.peer),r=smooth('p'+p.peer,q.x+(q.mv?DX[q.d]*4*a:0),q.y+(q.mv?DY[q.d]*4*a:0));tank(r.x,r.y,q.d,q.col||'#888');lbl(q.nm,r.x,r.y);g.fillStyle='#222';(q.b||[]).forEach(b=>g.fillRect((b[0]+DX[b[2]]*9*a)*T-2,(b[1]+DY[b[2]]*9*a)*T-2,4,4))}
 tank(me.x,me.y,me.d,myCol);lbl(myName,me.x,me.y);
 for(const b of isClient()?hbots(1):bots)if(!(b.dead>0))tank(b.x,b.y,b.d,'#6b4f4f');
 g.fillStyle='#222';bul.forEach(b=>{g.fillStyle=b.o?'#fff':'#c1121f';g.fillRect(b.x*T-2,b.y*T-2,4,4)});if(isClient())hbb().forEach(b=>{g.fillStyle='#c1121f';g.fillRect(b[0]*T-2,b[1]*T-2,4,4)});
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(map[y][x]==2){g.fillStyle='#1f7a3acc';g.beginPath();g.arc(x*T+8,y*T+8,7,0,7);g.fill()}
 if(phase=='count'){g.fillStyle='#000a';g.fillRect(0,0,N*T,N*T);g.fillStyle='#fff';g.font='bold 60px sans-serif';g.textAlign='center';g.fillText(Math.max(1,Math.ceil((cdEnd-performance.now())/1000)),N*T/2,N*T/2+20)}
 const pl=peers.filter(p=>!p.isMe&&p.presence&&p.presence.x!=null).length+1;
 document.getElementById('hud').textContent='Air '+Math.round(100*prog()/total)+'% (goal 85%) · You '+score+' · Hits '+hits+' · Players '+pl}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;fdt=dt;step(dt);draw();pt+=dt;if(pt>.05){pt=0;pub()}requestAnimationFrame(loop)}
function press(d){if(!dirs.includes(d))dirs.push(d)}function rel(d){dirs=dirs.filter(v=>v!=d)}
document.querySelectorAll('[data-d]').forEach(e=>{const d=+e.dataset.d;e.addEventListener('pointerdown',ev=>{ev.preventDefault();press(d)});['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,()=>rel(d)))});
const f=document.getElementById('fire');f.addEventListener('pointerdown',e=>{e.preventDefault();firing=true});['pointerup','pointercancel'].forEach(t=>f.addEventListener(t,()=>firing=false));
const K={ArrowUp:0,w:0,ArrowRight:1,d:1,ArrowDown:2,s:2,ArrowLeft:3,a:3};
const kk=e=>e.key.length==1?e.key.toLowerCase():e.key,typing=()=>/INPUT|TEXTAREA/.test(document.activeElement.tagName);
addEventListener('keydown',e=>{if(typing())return;const k=kk(e);if(k in K){press(K[k]);e.preventDefault()}if(k==' '){firing=true;e.preventDefault()}});
addEventListener('keyup',e=>{const k=kk(e);if(k in K)rel(K[k]);if(k==' ')firing=false});
cv.addEventListener('pointerdown',e=>{if(e.pointerType=='mouse'){firing=true;e.preventDefault()}});
addEventListener('pointerup',e=>{if(e.pointerType=='mouse')firing=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
reset();requestAnimationFrame(loop);
const $=id=>document.getElementById(id),msg=t=>$('st').textContent=t,show=(id,on)=>$(id).style.display=on?'flex':'none';
function newRound(){seed=Math.random()*1e9|0;reset();phase='count';cdEnd=performance.now()+3000;send(JSON.stringify({t:'start',sd:seed}))}
function away(t){chans=[];pm={};peers=[];phase='home';show('lb',0);show('hm',1);msg(t)}
function wire(c){c.on('close',()=>{chans=chans.filter(x=>x!==c);if(!isHost&&phase!='home')away('Host left the room.')});
 c.on('open',()=>{if(!chans.includes(c))chans.push(c)});
 c.on('data',d=>{let m;try{m=JSON.parse(d)}catch(x){return}
  if(m.t=='start'){seed=m.sd;reset();phase='count';cdEnd=performance.now()+3000;show('lb',0);return}
  if(m.t=='full'){away('Room is full or already playing.');return}
  if(m.t=='kill'){if(isHost&&bots[m.i]&&!(bots[m.i].dead>0))bots[m.i].dead=4;return}
  if(!m.id||m.id==myId)return;const o=pm[m.id];if(o&&m.q<o.p.q&&m.q>o.p.q-1000)return;pm[m.id]={p:o?Object.assign(o.p,m):m,t:Date.now()};if(isHost)send(d,c)})}
const mk=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
function lobby(){phase='lobby';show('hm',0);show('lb',1);$('rc').textContent=room;$('sg').style.display=isHost?'':'none'}
function tryHost(n){room=mk();const p=new Peer('gcity-'+room);
 p.on('open',lobby);
 p.on('error',e=>{if(e.type=='unavailable-id'&&n<5)tryHost(n+1);else msg('Could not create room: '+e.type)});
 p.on('connection',c=>{if(chans.length>=3||phase=='count'||phase=='play'){c.on('open',()=>{c.send(JSON.stringify({t:'full'}));setTimeout(()=>c.close(),300)});return}wire(c)})}
const ready=()=>{myName=$('pn').value.trim();if(!myName){msg('Enter a ranger name first.');return 0}if(typeof Peer=='undefined'){msg('Multiplayer library failed to load (offline?)');return 0}return 1};
$('cr').onclick=()=>{if(ready()){isHost=true;myId='a';msg('Creating room...');tryHost(0)}};
$('bj').onclick=()=>{if(!ready())return;const code=$('ci').value.trim().toUpperCase();if(code.length!=4)return msg('Codes have 4 letters.');
 room=code;msg('Joining...');const p=new Peer(),to=setTimeout(()=>{msg('Room not found. Check the code.');p.destroy()},8000);
 p.on('open',()=>{const c=p.connect('gcity-'+code,{reliable:false});wire(c);c.on('open',()=>{clearTimeout(to);lobby()})});
 p.on('error',e=>{clearTimeout(to);msg(e.type=='peer-unavailable'?'Room not found. Check the code.':'Connection error: '+e.type)})};
$('so').onclick=()=>{myName=$('pn').value.trim()||'Ranger';show('hm',0);newRound()};
$('sg').onclick=()=>{if(chans.length){show('lb',0);newRound()}};
$('nm').onclick=()=>{if(isHost||!chans.length)newRound()};
$('cp').onclick=()=>{try{navigator.clipboard.writeText(location.href.split('?')[0]+'?room='+room)}catch(e){}$('cp').textContent='Copied!';setTimeout(()=>$('cp').textContent='Copy invite link',1500)};
setInterval(()=>{if(phase!='lobby')return;const n=[myName+' (you)'].concat(peers.map(p=>p.presence.nm||'Ranger'));
 $('pl').textContent=n.join(', ')+' ('+n.length+'/4)';$('sg').disabled=n.length<2;
 $('lm').textContent=isHost?(n.length<2?'Waiting for rangers to join...':'Ready!'):'Waiting for the host to start.'},300);
const q=new URLSearchParams(location.search).get('room');if(q)$('ci').value=q.slice(0,4);
</script></body></html>
