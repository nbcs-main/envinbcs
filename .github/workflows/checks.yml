name: Site checks

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Run site checks (broken links, alt text, lang, images over 1 MB, placeholder text)
        run: python3 scripts/check_site.py
